<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Empréstimos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Empréstimos</ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="container">
    <app-table-list [itemList]="bookLoans" [headers]="['Membro', 'Email', 'Título', 'Autor']" type="loan" baseType="bookLoans"></app-table-list>
  </div>
</ion-content>
