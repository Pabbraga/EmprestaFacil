<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Livros</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Livros</ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="container">
    <app-table-list [itemList]="books" [headers]="headers" baseType="books"></app-table-list>
  </div>
</ion-content>
