<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button color="medium" (click)="cancel()">Cancelar</ion-button>
    </ion-buttons>
    <ion-title>Editar</ion-title>
    <ion-buttons slot="end">
      <ion-button id="open-toast" expand="block" (click)="confirm()" [strong]="true">Confirmar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  @for (h of headers; track h; let i = $index) {
    <ion-item [style.display]="(type==='loan'?'none':'block')">
      <ion-input labelPlacement="stacked" label="{{h}}" [(ngModel)]="itemToModify[indexes[i]]" placeholder="{{itemToModify[indexes[i+1]]}}"></ion-input>
    </ion-item>
  }
  @if (type === 'loan') {
    <ion-item>
      <ion-select 
        label="Membro" 
        label-placement="stacked" 
        placeholder="Selecione um Membro" 
        [(ngModel)]="itemToModify['member']"
        disabled="true"
        >
          <ion-select-option [value]="itemToModify['member']">{{itemToModify['member']['name']}}</ion-select-option>
      </ion-select>
    </ion-item>
    <ion-item>
      <ion-select 
        label="Livro" 
        label-placement="stacked" 
        placeholder="Selecione um Livro" 
        [(ngModel)]="itemToModify['book']"
        disabled="true"
      >
          <ion-select-option [value]="itemToModify['book']">{{itemToModify['book']['title']}}</ion-select-option>
      </ion-select>
    </ion-item>
    <div class="datetime-item">
      <ion-label>Data de Empréstimo</ion-label>
      <ion-datetime-button datetime="loan-datetime"></ion-datetime-button>
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime [(ngModel)]="itemToModify['loanDatetime']" id="loan-datetime"></ion-datetime>
        </ng-template>
      </ion-modal>
    </div>
    <div class="datetime-item">
      <ion-label>Prazo de Devolução</ion-label>
      <ion-datetime-button datetime="due-date"></ion-datetime-button>
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime [(ngModel)]="itemToModify['dueDate']" presentation="date" id="due-date"></ion-datetime>
        </ng-template>
      </ion-modal>
    </div>
    <ion-item>
      <ion-checkbox [(ngModel)]="itemToModify['isReturned']" labelPlacement="end">Devolvido</ion-checkbox>
    </ion-item>
    @if (itemToModify['isReturned']) {
      <div class="datetime-item">
        <ion-label>Data de Devolução</ion-label>
        <ion-datetime-button datetime="checkout-datetime"></ion-datetime-button>
        <ion-modal [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime [(ngModel)]="itemToModify['checkoutDatetime']" id="checkout-datetime"></ion-datetime>
          </ng-template>
        </ion-modal>
      </div>
    }
  }
</ion-content>
