<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button color="medium" (click)="cancel()">Cancelar</ion-button>
    </ion-buttons>
    <ion-title>Adicionar</ion-title>
    <ion-buttons slot="end">
      <ion-button id="open-toast" expand="block" (click)="confirm()" [strong]="true">Confirmar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  @for (h of headers; track h; let i = $index) {
    <ion-item>
      <ion-input labelPlacement="stacked" label="{{h}}" [(ngModel)]="newItem[indexes[i+1]]" placeholder="{{h}}"></ion-input>
    </ion-item>
  }
</ion-content>
